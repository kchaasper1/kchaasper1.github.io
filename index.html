<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🏠 House Game</h1>
<div id="startScreen">
  <p>Move between rooms, play the mini-game in each. Others online will appear as they walk around.</p>
  <input id="nameInput" placeholder="Your name" maxlength="16">
  <button id="startBtn">Enter the house</button>
  <div id="status"></div>
</div>

<div id="gameWrap">
  <canvas id="canvas" width="720" height="460"></canvas>

  <div id="infoRow">
    <div id="hint">Arrow keys / WASD to move. Shift to run. Space to shoot.</div>
    <div id="stats">
      <div id="moneyRow">
        <div id="moneyDisplay">💰 $5</div>
        <div id="bankDisplay">🏦 $0</div>
      </div>
      <div id="expenseDisplay">Expenses: $0/min</div>
      <div id="mineralDisplay">⛏️ Iron 0 · Copper 0 · Gold 0</div>
      <div id="staminaRow">🏃 <div id="staminaWrap"><div id="staminaBar"></div></div></div>
    </div>
  </div>
  <div id="toast"></div>

  <button id="playCta">Play mini-game (E)</button>
  <button id="fireBtn">🔫 Fire</button>
  <button id="runBtn">🏃 Run: OFF</button>
</div>

<div class="modal" id="modal">
  <div class="modal-inner">
    <h2 id="modalTitle"></h2>
    <div id="miniArea"></div>
    <div id="miniScore"></div>
    <button id="closeModal">Close</button>
  </div>
</div>

<div class="modal" id="bankModal">
  <div class="modal-inner">
    <h2>🏦 Bank</h2>
    <p id="bankBalances"></p>
    <div class="bank-row">
      <input id="depAmt" type="number" min="1" step="1" inputmode="numeric" placeholder="Amount to deposit">
      <button id="depositBtn">Deposit</button>
    </div>
    <div class="bank-row">
      <input id="wdAmt" type="number" min="1" step="1" inputmode="numeric" placeholder="Amount to withdraw">
      <button id="withdrawBtn">Withdraw</button>
    </div>
    <div class="bank-row">
      <button id="depositAllBtn">Deposit everything</button>
      <button id="withdrawAllBtn">Withdraw everything</button>
    </div>
    <p id="bankMsg"></p>
    <button id="closeBank">Leave bank</button>
  </div>
</div>

<div class="modal" id="garageModal">
  <div class="modal-inner">
    <h2>🔧 Garage</h2>
    <p id="garageMinerals"></p>
    <div id="garageList"></div>
    <button id="closeGarage">Leave garage</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script src="util.js"></script>
<script src="world.js"></script>
<script src="state.js"></script>
<script src="ui.js"></script>
<script src="net.js"></script>
<script src="bank.js"></script>
<script src="mine.js"></script>
<script src="garage.js"></script>
<script src="pedestrians.js"></script>
<script src="goons.js"></script>
<script src="combat.js"></script>
<script src="player.js"></script>
<script src="interact.js"></script>
<script src="minigames.js"></script>
<script src="input.js"></script>
<script src="render.js"></script>
<script src="main.js"></script>
</body>
</html>
