<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Game</title>
<style>
  :root{ --bg:#20242b; --panel:#2b3038; --text:#eee; --muted:#9aa1ac; --accent:#e0824f; --accent2:#4fae8f; --border:#3c414b; }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;}
  h1{margin:4px 0;font-size:1.4rem;}
  #startScreen{text-align:center;max-width:360px;margin-top:60px;}
  #startScreen input{padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);width:100%;margin:10px 0;font-size:1rem;}
  #startScreen button, .modal button, #gameUI button{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:1rem;cursor:pointer;}
  #status{color:var(--muted);font-size:.85rem;margin-top:8px;}
  #gameWrap{display:none;flex-direction:column;align-items:center;}
  #canvas{background:#111;border-radius:10px;touch-action:none;max-width:100%;}
  #hint{color:var(--muted);font-size:.85rem;margin-top:8px;text-align:center;}
  #playCta{display:none;margin-top:8px;}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10;}
  .modal.active{display:flex;}
  .modal-inner{background:var(--panel);border-radius:14px;padding:20px;width:320px;max-width:92vw;text-align:center;}
  .modal-inner h2{margin-top:0;}
  #miniArea{position:relative;height:260px;background:#111;border-radius:8px;overflow:hidden;margin:12px 0;}
  .falling,.pop{position:absolute;font-size:1.6rem;cursor:pointer;user-select:none;}
  .hole{position:absolute;width:60px;height:60px;background:#222;border-radius:50%;}
  #reflexBtn{width:120px;height:120px;border-radius:50%;border:none;font-size:1rem;margin:20px auto;display:block;cursor:pointer;}
  
  #miniScore{color:var(--muted);}
  
  #toast{min-height:18px;color:var(--accent);font-size:.85rem;margin-top:4px;}

  button{touch-action:manipulation;}
  #fireBtn{display:none;margin-top:8px;margin-left:8px;}
</style>
</head>
<body>

<h1>🏠 House Game</h1>
<div id="startScreen">
  <p>Move between rooms, play the mini-game in each. Others online will appear as they walk around.</p>
  <input id="nameInput" placeholder="Your name" maxlength="16">
  <button id="startBtn">Enter the house</button>
  <div id="status"></div>
</div>



<div id="gameWrap">
  <canvas id="canvas" width="720" height="460"></canvas>
  
  <div id="moneyDisplay">💰 $5</div>
  
  <div id="toast"></div>
  
  <div id="hint">Arrow keys / WASD to move. Space to shoot.</div>
  
  <button id="playCta">Play mini-game (E)</button>
  <button id="fireBtn">🔫 Fire</button>
</div>



<div class="modal" id="modal">
  <div class="modal-inner">
    <h2 id="modalTitle"></h2>
    <div id="miniArea"></div>
    <div id="miniScore"></div>
    <button id="closeModal">Close</button>
  </div>
</div>



<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
/* ====== 1) PASTE YOUR FIREBASE CONFIG HERE ====== */
const firebaseConfig = {
  apiKey: "AIzaSyBlC2luCyQGEok4heizoj7zR9h4mbdMGGQ",
  authDomain: "test-cef34.firebaseapp.com",
  databaseURL: "https://test-cef34-default-rtdb.firebaseio.com",
  projectId: "test-cef34"
};
/* ================================================= */



let db = null, playersRef = null, myId = null, myName = "", myColor = "#e0824f";
let pedsRef=null, pedPosRef=null, goonsRef=null;
let playersLoaded=false, otherGoons={};
let firebaseOk = false;
try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    playersRef = db.ref("housegame/players");
    pedsRef=db.ref("housegame/peds");
    pedPosRef=db.ref("housegame/pedpos");
    goonsRef=db.ref("housegame/goons");
    firebaseOk = true;
  }
} catch(e){ console.error("Firebase init failed", e); }

const startScreen=document.getElementById('startScreen');
const statusEl=document.getElementById('status');
const gameWrap=document.getElementById('gameWrap');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const playCta=document.getElementById('playCta');

statusEl.textContent = firebaseOk
  ? "Multiplayer connected."
  : "Running solo — add your Firebase config in the file to enable multiplayer.";



// ---- Rooms layout (3 side-by-side rooms) ----
const rooms=[
  {name:'Living Room', x0:0,   x1:240, color:'#2c3550', pad:{x:120,y:230}, game:'reflex'},
  {name:'Kitchen',     x0:240, x1:480, color:'#3a3324', pad:{x:360,y:230}, game:'chop'},
  {name:'Bedroom',     x0:480, x1:720, color:'#33243a', pad:{x:600,y:230}, game:'clocks'}
];
function roomAt(x){ return rooms.find(r=>x>=r.x0 && x<r.x1) || rooms[0]; }

let scene = 'outside'; // 'outside' | 'inside'
const outside = {
  building:{x:260,y:40,w:200,h:220},
  door:{x:340,y:240,w:40,h:20},
  label:{x:360,y:30}
};
const insideExit = {x:30,y:230}; // walk here (inside) to step back out to the street



// ---- Player state ----
let player={x:360,y:420,r:12};
let facing={dx:0,dy:-1};

const touchMode = window.matchMedia('(pointer: coarse)').matches; // set to true to test on desktop
let moveTarget=null;
const fireBtn=document.getElementById('fireBtn');

function fireBullet(){
  bullets.push({x:player.x,y:player.y,dx:facing.dx*7,dy:facing.dy*7,owner:'player'});
}
fireBtn.addEventListener('pointerdown',e=>{ e.preventDefault(); fireBullet(); });

function canvasPoint(e){
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)*canvas.width/r.width, y:(e.clientY-r.top)*canvas.height/r.height};
}

// returns the interactive spot under a tap (door, alley, exit, mini-game pad), if any
function tappedInteractable(x,y){
  if(scene==='outside'){
    const dx0=outside.door.x+outside.door.w/2, dy0=outside.door.y;
    if(Math.hypot(x-dx0,y-dy0)<40) return {x:dx0,y:dy0,r:35};
    if(x>alley.x&&x<alley.x+alley.w&&y>alley.y&&y<alley.y+alley.h)
      return {x:alley.x+alley.w/2,y:alley.y+alley.h/2,r:70};
  } else {
    if(Math.hypot(x-insideExit.x,y-insideExit.y)<40) return {x:insideExit.x,y:insideExit.y,r:35};
    for(const r of rooms)
      if(Math.hypot(x-r.pad.x,y-r.pad.y)<40) return {x:r.pad.x,y:r.pad.y,r:40};
  }
  return null;
}
  
let bullets=[];
  
const alley = {x:550,y:40,w:140,h:140};
const GOON_COST = 5;
let goons=[]; // {id,x,y,tx,ty,speed}
let goonCounter=0;
const toastEl=document.getElementById('toast');
function toast(msg){
  toastEl.textContent=msg;
  clearTimeout(toastEl._t);
  toastEl._t=setTimeout(()=>toastEl.textContent='',1800);
}

let pointerDown=false;
canvas.addEventListener('pointerdown',e=>{
  if(!touchMode) return;
  e.preventDefault();
  pointerDown=true;
  const p=canvasPoint(e);
  const t=tappedInteractable(p.x,p.y);
  if(t){
    if(Math.hypot(player.x-t.x,player.y-t.y)<t.r) onInteract(); // already there: act
    else moveTarget={x:t.x,y:t.y};                              // otherwise walk there first
  } else {
    moveTarget=p;
  }
});
canvas.addEventListener('pointermove',e=>{       // dragging a finger steers
  if(!touchMode||!pointerDown) return;
  const p=canvasPoint(e);
  if(!tappedInteractable(p.x,p.y)) moveTarget=p;
});
window.addEventListener('pointerup',()=>pointerDown=false);

let money=5;
const moneyDisplay=document.getElementById('moneyDisplay');
function earnDollar(){
  money++;
  moneyDisplay.textContent='💰 $'+money;
}
  
const keys={};
let otherPlayers={};
let currentRoom=roomAt(player.x);



document.getElementById('startBtn').onclick=()=>{
  if(touchMode){
  document.getElementById('hint').textContent='Tap to walk. Tap a door, the alley or a mini-game spot while standing at it to use it.';
  fireBtn.style.display='inline-block';
}
  
  myName=document.getElementById('nameInput').value.trim() || 'Guest';
  myId='p'+Math.random().toString(36).slice(2,9);
  myColor=`hsl(${Math.floor(Math.random()*360)},70%,60%)`;
  startScreen.style.display='none';
  gameWrap.style.display='flex';
  initMultiplayer();
  requestAnimationFrame(loop);
  startSimulation();
};



function initMultiplayer(){
  if(!firebaseOk) return;
  playersRef.child(myId).onDisconnect().remove();
  goonsRef.child(myId).onDisconnect().remove();
  updatePresence();

  playersRef.on('value', snap=>{
  const val=snap.val()||{};
  delete val[myId];
  const firstLoad=!playersLoaded;
  otherPlayers=val;
  playersLoaded=true;
  if(firstLoad && Object.keys(val).length===0){
    pedsRef.remove(); pedPosRef.remove(); goonsRef.remove(); // nobody else is here, so clear leftovers
  }
});
  goonsRef.on('value', snap=>{ otherGoons=snap.val()||{}; });

  // pedestrian details (money, color) live here
  pedsRef.on('value', snap=>{
    const val=snap.val()||{};
    pedestrians=pedestrians.filter(p=>val[p.id]);
    Object.keys(val).forEach(id=>{
      const v=val[id];
      let p=pedestrians.find(q=>q.id===id);
      if(!p){
        p={id,x:v.x0,y:v.y0,rx:v.x0,ry:v.y0,leaving:false};
        pedestrians.push(p);
      }
      p.money=v.money; p.color=v.color; p.speed=v.speed;
    });
  });
  // pedestrian positions (written by the host)
  pedPosRef.on('value', snap=>{
    const val=snap.val()||{};
    pedestrians.forEach(p=>{
      const pos=val[p.id];
      if(pos){ p.rx=pos.x; p.ry=pos.y; }
    });
  });
}
  
function isHost(){
  if(!firebaseOk) return true;       // solo mode: you simulate everything
  if(!playersLoaded) return false;
  return Object.keys(otherPlayers).every(id=>id>myId); // lowest ID wins
}

let lastSent=0;
function updatePresence(){
  if(!firebaseOk) return;
  const now=Date.now();
  if(now-lastSent<120) return;
  lastSent=now;
  playersRef.child(myId).set({name:myName,color:myColor,x:player.x,y:player.y,room:currentRoom?currentRoom.name:null,scene:scene});
}



// ---- Movement ----
document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==='e') onInteract();
  if(e.key===' '){
    e.preventDefault();
    if(e.key===' '){ e.preventDefault(); fireBullet(); }
  }
});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);



function update(){
  let dx=0,dy=0, speed=3.2;
  if(keys['arrowup']||keys['w']) dy=-speed;
  if(keys['arrowdown']||keys['s']) dy=speed;
  if(keys['arrowleft']||keys['a']) dx=-speed;
  if(keys['arrowright']||keys['d']) dx=speed;
  if(dx||dy){
  moveTarget=null;   // keyboard input cancels tap-to-move
  facing={dx: dx?Math.sign(dx):0, dy: dy?Math.sign(dy):(dx?0:facing.dy)};
} else if(moveTarget){
  const d=Math.hypot(moveTarget.x-player.x, moveTarget.y-player.y);
  if(d<=speed){ moveTarget=null; }
  else {
    dx=(moveTarget.x-player.x)/d*speed;
    dy=(moveTarget.y-player.y)/d*speed;
    facing={dx:dx/speed, dy:dy/speed};
  }
}

  let nx=Math.min(720-player.r, Math.max(player.r, player.x+dx));
  let ny=Math.min(460-player.r, Math.max(player.r, player.y+dy));

  if(scene==='outside'){
    const b=outside.building;
    const inside_x = nx>b.x && nx<b.x+b.w;
    const inside_y = ny>b.y && ny<b.y+b.h;
    const inDoorX = nx>outside.door.x && nx<outside.door.x+outside.door.w;
    const blocked = inside_x && inside_y && !(inDoorX && ny>b.y+b.h-25);
    if(!blocked){ player.x=nx; player.y=ny; } else moveTarget=null; // stop pushing against the building
  } else {
    player.x=nx; player.y=ny;
  }

  if(scene==='inside') currentRoom=roomAt(player.x);
  updatePresence();

  bullets.forEach(b=>{ b.x+=b.dx; b.y+=b.dy; });
  
  if(scene==='outside'){
    bullets.forEach(b=>{
      if(b.dead) return;
      for(const p of pedestrians){
        if(Math.hypot(p.x-b.x,p.y-b.y)<11){ b.dead=true; killPed(p,b.owner); break; }
      }
    });
  }
  bullets=bullets.filter(b=>!b.dead&&b.x>0&&b.x<720&&b.y>0&&b.y<460);
  
  updatePedestrians();
  updateGoons();
  
  if(scene==='outside'){
    const d=Math.hypot(player.x-(outside.door.x+outside.door.w/2), player.y-outside.door.y);
    const inAlley = player.x>alley.x && player.x<alley.x+alley.w && player.y>alley.y && player.y<alley.y+alley.h;
    if(d<35){ playCta.textContent='Enter supermarket (E)'; playCta.style.display='inline-block'; }
    else if(inAlley){ playCta.textContent='Hire goon - $'+GOON_COST+' (E)'; playCta.style.display='inline-block'; }
    else playCta.style.display='none';
  } else {
    const dExit=Math.hypot(player.x-insideExit.x, player.y-insideExit.y);
    const dPad=Math.hypot(player.x-currentRoom.pad.x, player.y-currentRoom.pad.y);
    if(dExit<35){ playCta.textContent='Exit to street (E)'; playCta.style.display='inline-block'; }
    else if(dPad<40){ playCta.textContent='Play mini-game (E)'; playCta.style.display='inline-block'; }
    else playCta.style.display='none';
  }
}



function draw(){
  ctx.clearRect(0,0,720,460);
  if(scene==='outside') drawOutside(); else drawInside();

  bullets.forEach(b=>{
  if(b.owner==='goon' && scene!=='outside') return;
  ctx.beginPath(); ctx.arc(b.x,b.y,4,0,Math.PI*2);
  ctx.fillStyle=b.owner==='goon' ? '#ff8a5c' : '#ffe066'; ctx.fill();
});

  Object.values(otherPlayers).forEach(p=>{
    if(p.scene===scene) drawAvatar(p.x,p.y,p.color,p.name);
  });
  drawAvatar(player.x,player.y,myColor,myName+' (you)');
}

function drawGoon(x,y,label){
  ctx.beginPath(); ctx.arc(x,y,10,0,Math.PI*2);
  ctx.fillStyle='#444'; ctx.fill();
  ctx.strokeStyle='#999'; ctx.stroke();
  ctx.fillStyle='#ddd'; ctx.font='10px sans-serif'; ctx.textAlign='center';
  ctx.fillText(label, x, y-15);
}

function drawOutside(){
  ctx.fillStyle='#4a6b4a'; ctx.fillRect(0,0,720,460); // grass/ground
  ctx.fillStyle='#555'; ctx.fillRect(0,300,720,80); // road
  ctx.fillStyle='#777'; ctx.fillRect(0,380,720,20); // sidewalk
  const b=outside.building;
  ctx.fillStyle='#8a7054'; ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.fillStyle='#5b4a38'; ctx.fillRect(outside.door.x,outside.door.y,outside.door.w,outside.door.h+(b.y+b.h-outside.door.y));
  ctx.fillStyle='#fff'; ctx.font='14px sans-serif'; ctx.textAlign='center';
  ctx.fillText('SUPERMARKET', outside.label.x, outside.label.y);

  ctx.fillStyle='#1a1a1a'; ctx.fillRect(alley.x,alley.y,alley.w,alley.h);
  ctx.fillStyle='#ccc'; ctx.font='13px sans-serif'; ctx.textAlign='center';
  ctx.fillText('DARK ALLEY', alley.x+alley.w/2, alley.y+20);
  ctx.font='11px sans-serif'; ctx.fillStyle='#999';
  ctx.fillText('Hire goon: $'+GOON_COST, alley.x+alley.w/2, alley.y+38);

  pedestrians.forEach(p=>{
    ctx.beginPath(); ctx.arc(p.x,p.y,9,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.fill();
    ctx.fillStyle='#8f8'; ctx.font='bold 11px sans-serif'; ctx.textAlign='center';
    ctx.fillText('$'+p.money, p.x, p.y-14);
  });

  // your goons
  goons.forEach(g=>drawGoon(g.x,g.y,myName+"'s goon"));
  // other players' goons
  Object.keys(otherGoons).forEach(oid=>{
    const owner=otherPlayers[oid];
    if(oid===myId || !owner) return;
    Object.values(otherGoons[oid]||{}).forEach(g=>drawGoon(g.x,g.y,owner.name+"'s goon"));
  });
}

function drawInside(){
  ctx.fillStyle='#15171c'; ctx.fillRect(0,0,720,460);
  rooms.forEach(r=>{
    ctx.fillStyle=r.color;
    ctx.fillRect(r.x0,0,r.x1-r.x0,460);
    ctx.fillStyle='#00000055';
    ctx.beginPath(); ctx.arc(r.pad.x,r.pad.y,22,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff9';
    ctx.font='12px sans-serif'; ctx.textAlign='center';
    ctx.fillText(r.name, (r.x0+r.x1)/2, 24);
    ctx.fillText('mini-game', r.pad.x, r.pad.y+40);
  });
  ctx.fillStyle='#4fae8f'; ctx.fillRect(insideExit.x-10,insideExit.y-16,20,32);
  ctx.fillStyle='#fff9'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText('exit', insideExit.x, insideExit.y+30);
}
function drawAvatar(x,y,color,label){
  ctx.beginPath(); ctx.arc(x,y,12,0,Math.PI*2);
  ctx.fillStyle=color; ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='11px sans-serif'; ctx.textAlign='center';
  ctx.fillText(label, x, y-16);
}



function loop(){ draw(); requestAnimationFrame(loop); }

const STEP_MS=1000/60;
let lastTick=Date.now();
function tick(){
  const now=Date.now();
  const raw=Math.floor((now-lastTick)/STEP_MS);
  if(raw<1) return;
  const steps=Math.min(raw,180);               // catch up at most ~3s at once
  lastTick = raw>180 ? now : lastTick+steps*STEP_MS;
  for(let i=0;i<steps;i++) update();
}
function startSimulation(){
  lastTick=Date.now();
  try{
    // a Web Worker's timer isn't throttled as hard as the page's own timers in background tabs
    const w=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),16)'],{type:'text/javascript'})));
    w.onmessage=tick;
  }catch(e){
    setInterval(tick,16);
  }
}



// ---- Mini-games ----
const modal=document.getElementById('modal');
const modalTitle=document.getElementById('modalTitle');
const miniArea=document.getElementById('miniArea');
const miniScore=document.getElementById('miniScore');
document.getElementById('closeModal').onclick=closeModal;
playCta.onclick=onInteract;



let activeTimer=null;
function onInteract(){
  if(scene==='outside'){
    const d=Math.hypot(player.x-(outside.door.x+outside.door.w/2), player.y-outside.door.y);
    if(d<35){ enterBuilding(); return; }
    const inAlley = player.x>alley.x && player.x<alley.x+alley.w && player.y>alley.y && player.y<alley.y+alley.h;
    if(inAlley) hireGoon();
  } else {
    const dExit=Math.hypot(player.x-insideExit.x, player.y-insideExit.y);
    if(dExit<35){ exitBuilding(); return; }
    const d=Math.hypot(player.x-currentRoom.pad.x, player.y-currentRoom.pad.y);
    if(d<40) openGame(currentRoom.game, currentRoom.name);
  }
}



function enterBuilding(){ scene='inside'; player.x=50; player.y=230; }
function exitBuilding(){ scene='outside'; player.x=360; player.y=300; }
function closeModal(){
  modal.classList.remove('active');
  if(activeTimer) clearInterval(activeTimer);
  miniArea.innerHTML='';
}



function hireGoon(){
  if(money<GOON_COST){ toast('Need $'+GOON_COST+' to hire a goon'); return; }
  money-=GOON_COST;
  moneyDisplay.textContent='💰 $'+money;
  goonCounter++;
  goons.push({id:'g'+goonCounter, x:player.x, y:player.y, tx:player.x, ty:player.y, speed:1.2});
  toast('Hired a goon! ('+goons.length+' total)');
}

const SHOOT_CHANCE=0.01;          // chance per frame once the cooldown is over
const GOON_SHOT_COOLDOWN=6000;    // ms between shots, per goon
const GOON_BULLET_SPEED=6;

let lastGoonSync=0;
function syncGoons(){
  if(!firebaseOk) return;
  const now=Date.now();
  if(now-lastGoonSync<150) return;
  lastGoonSync=now;
  goonsRef.child(myId).set(goons.length ? goons.map(g=>({x:Math.round(g.x),y:Math.round(g.y)})) : null);
}

function updateGoons(){
  const now=Date.now();
  goons.forEach(g=>{
    let prey=null, best=140;
    pedestrians.forEach(p=>{
      if(p.money<=0) return;
      const d=Math.hypot(p.x-g.x,p.y-g.y);
      if(d<best){ best=d; prey=p; }
    });
    if(prey){ g.tx=prey.x; g.ty=prey.y; }
    else if(Math.hypot(g.tx-g.x,g.ty-g.y)<4){
      g.tx=20+Math.random()*680; g.ty=20+Math.random()*420;
    }
    const ang=Math.atan2(g.ty-g.y,g.tx-g.x);
    g.x+=Math.cos(ang)*g.speed;
    g.y+=Math.sin(ang)*g.speed;

    if(prey && scene==='outside' && now>=(g.nextShot||0) && Math.random()<SHOOT_CHANCE){
      g.nextShot=now+GOON_SHOT_COOLDOWN;
      const a=Math.atan2(prey.y-g.y,prey.x-g.x)+(Math.random()-0.5)*0.5;
      bullets.push({x:g.x,y:g.y,dx:Math.cos(a)*GOON_BULLET_SPEED,dy:Math.sin(a)*GOON_BULLET_SPEED,owner:'goon'});
    }

    if(now<(g.nextSteal||0)) return;
    pedestrians.forEach(p=>{
      if(p.money<=0) return;
      if(Math.hypot(p.x-g.x,p.y-g.y)<16){
        g.nextSteal=now+2000;
        if(Math.random()<STEAL_CHANCE){
          stealFromPed(p, 1+Math.floor(Math.random()*Math.min(3,p.money)));
        } else {
          toast('A goon failed to steal...');
        }
      }
    });
  });
  syncGoons();
}
const STEAL_CHANCE = 0.4; // 40% chance per attempt, change to taste



let pedestrians=[];
let pedCounter=0;
const MAX_PEDS=8;
const LEAVE_CHANCE=0.0008;  // per frame, per pedestrian (roughly once every 20s)
const SPAWN_CHANCE=0.004;   // per frame while below MAX_PEDS (roughly one every 4s)

function spawnPedestrian(fromEdge){
  const y=305+Math.random()*85;
  const x=fromEdge ? (Math.random()<0.5 ? -15 : 735) : 20+Math.random()*680;
  const p={
    id:myId+'_'+(pedCounter++),
    x, y, tx:x, ty:y, leaving:false,
    speed:0.6+Math.random()*0.4,
    money:1+Math.floor(Math.random()*10),
    color:`hsl(${Math.floor(Math.random()*360)},35%,65%)`
  };
pedestrians.push(p);
  if(firebaseOk) pedsRef.child(p.id).set({money:p.money,color:p.color,speed:p.speed,x0:Math.round(x),y0:Math.round(y)});
}

let lastPedSync=0;
function syncPedsHost(){
  if(!firebaseOk) return;
  const now=Date.now();
  if(now-lastPedSync<150) return;
  lastPedSync=now;
  const pos={};
  pedestrians.forEach(p=>pos[p.id]={x:Math.round(p.x),y:Math.round(p.y)});
  pedPosRef.set(pos);
}  

function updatePedestrians(){
  const host=isHost();
  pedestrians.forEach(p=>{
    if(!host){ // everyone else just glides toward the host's latest position
      if(p.rx!==undefined){ p.x+=(p.rx-p.x)*0.25; p.y+=(p.ry-p.y)*0.25; }
      return;
    }
    if(p.tx===undefined){ p.tx=p.x; p.ty=p.y; } // after a host handover
    if(!p.leaving && Math.random()<LEAVE_CHANCE){
      p.leaving=true;
      p.tx = p.x<360 ? -30 : 750;
      p.ty = p.y;
    }
    if(!p.leaving && Math.hypot(p.tx-p.x,p.ty-p.y)<4){
      p.tx=10+Math.random()*700;
      p.ty=305+Math.random()*85;
    }
    const ang=Math.atan2(p.ty-p.y,p.tx-p.x);
    p.x+=Math.cos(ang)*p.speed;
    p.y+=Math.sin(ang)*p.speed;
    if(!p.leaving && p.money<10 && Math.random()<0.001){
      if(firebaseOk) pedsRef.child(p.id+'/money').transaction(m=>m===null?m:Math.min(10,m+1));
      else p.money++;
    }
    if(p.leaving && (p.x<-20||p.x>740)){
      p.gone=true;
      if(firebaseOk) pedsRef.child(p.id).remove();
    }
  });
  pedestrians=pedestrians.filter(p=>!p.gone);
  if(host){
    const chance=pedestrians.length<4 ? 0.05 : SPAWN_CHANCE; // fill the street quickly at first
    if(pedestrians.length<MAX_PEDS && Math.random()<chance) spawnPedestrian(true);
    syncPedsHost();
  }
}

// Shared kill/steal helpers: transactions make sure only one player gets the money
function killPed(p,who){
  if(!firebaseOk){
    money+=p.money; pedestrians=pedestrians.filter(q=>q!==p);
    moneyDisplay.textContent='💰 $'+money;
    toast((who==='goon'?'A goon':'You')+' shot a pedestrian'+(p.money?' (+$'+p.money+')':''));
    return;
  }
  let loot=0;
  pedsRef.child(p.id).transaction(cur=>{
    if(!cur) return;          // already gone, abort
    loot=cur.money;
    return null;              // delete it
  },(err,committed)=>{
    if(committed){
      money+=loot;
      moneyDisplay.textContent='💰 $'+money;
      toast((who==='goon'?'A goon':'You')+' shot a pedestrian'+(loot?' (+$'+loot+')':''));
    }
  });
}

function stealFromPed(p,amt){
  if(!firebaseOk){
    const t=Math.min(amt,p.money); p.money-=t; money+=t;
    moneyDisplay.textContent='💰 $'+money; toast('Goon stole $'+t+'!');
    return;
  }
  let taken=0;
  pedsRef.child(p.id+'/money').transaction(m=>{
    if(m===null||m<=0) return;
    taken=Math.min(amt,m);
    return m-taken;
  },(err,committed)=>{
    if(committed && taken>0){
      money+=taken;
      moneyDisplay.textContent='💰 $'+money;
      toast('Goon stole $'+taken+'!');
    }
  });
}


function openGame(type,label){
  modal.classList.add('active');
  modalTitle.textContent=label+" mini-game";
  miniArea.innerHTML=''; miniScore.textContent='';
  if(type==='reflex') startReflex();
  if(type==='chop') startChop();
  if(type==='clocks') startClocks();
}



// Reflex tap — completes after 5 rounds
function startReflex(){
  let round=0, times=[], startT=0, done=false;
  const btn=document.createElement('button');
  btn.id='reflexBtn'; btn.textContent='Wait...'; btn.style.background='#555';
  miniArea.appendChild(btn);
  
  function nextRound(){
    if(round>=5){
      miniScore.textContent='Avg: '+Math.round(times.reduce((a,b)=>a+b,0)/times.length)+'ms — ✅ Completed! +$1';
      btn.textContent='Done!';
      if(!done){ done=true; earnDollar(); }
      return;
    }
    btn.style.background='#a33'; btn.textContent='Wait...';
    setTimeout(()=>{ btn.style.background='#2e6b5e'; btn.textContent='TAP!'; startT=Date.now(); },600+Math.random()*1200);
  }
  
  btn.onclick=()=>{
    if(btn.textContent!=='TAP!') return;
    times.push(Date.now()-startT); round++;
    miniScore.textContent='Round '+round+'/5';
    nextRound();
  };
  nextRound();
}



// Chop — completes when target score is reached
function startChop(){
  let score=0, timeLeft=20, target=12, done=false;
  miniScore.textContent='Score: 0 / '+target+' | Time: 20s';
  const items=['🥕','🥦','🍅','🍆','💣'];
  activeTimer=setInterval(()=>{
    timeLeft--;
    if(!done) miniScore.textContent='Score: '+score+' / '+target+' | Time: '+timeLeft+'s';
    if(timeLeft<=0 && !done){ clearInterval(activeTimer); miniArea.innerHTML='<p style="padding-top:100px">Time up — score '+score+'/'+target+'. Try again!</p>'; }
  },1000);
  
  const spawn=setInterval(()=>{
    if(timeLeft<=0||done){ clearInterval(spawn); return; }
    const el=document.createElement('div');
    const emoji=items[Math.floor(Math.random()*items.length)];
    el.className='falling'; el.textContent=emoji;
    el.style.left=(Math.random()*220)+'px'; el.style.top='0px';
    miniArea.appendChild(el);
    let top=0;
    const fall=setInterval(()=>{
      top+=4; el.style.top=top+'px';
      if(top>230){ clearInterval(fall); el.remove(); }
    },30);
    el.onclick=()=>{
      clearInterval(fall); el.remove();
      score += emoji==='💣' ? -1 : 1;
      if(score>=target && !done){
        done=true; clearInterval(activeTimer); clearInterval(spawn);
        miniScore.textContent='✅ Completed! +$1';
        earnDollar();
      }
    };
  },600);
}



// Whack clocks — completes when target score is reached
function startClocks(){
  let score=0, timeLeft=20, target=8, done=false;
  miniScore.textContent='Score: 0 / '+target+' | Time: 20s';
  const holes=[];
  for(let i=0;i<6;i++){
    const h=document.createElement('div');
    h.className='hole';
    h.style.left=(20+(i%3)*90)+'px';
    h.style.top=(20+Math.floor(i/3)*120)+'px';
    miniArea.appendChild(h);
    holes.push(h);
  }
  
  activeTimer=setInterval(()=>{
    timeLeft--;
    if(!done) miniScore.textContent='Score: '+score+' / '+target+' | Time: '+timeLeft+'s';
    if(timeLeft<=0 && !done){ clearInterval(activeTimer); clearInterval(popper); miniArea.innerHTML='<p style="padding-top:100px">Time up — score '+score+'/'+target+'. Try again!</p>'; }
  },1000);
  
  const popper=setInterval(()=>{
    if(timeLeft<=0||done) return;
    const h=holes[Math.floor(Math.random()*holes.length)];
    const clock=document.createElement('div');
    clock.className='pop'; clock.textContent='⏰';
    clock.style.left=h.style.left; clock.style.top=h.style.top;
    let clicked=false;
    clock.onclick=()=>{
      if(!clicked){
        clicked=true; score++; clock.remove();
        if(score>=target && !done){
          done=true; clearInterval(activeTimer); clearInterval(popper);
          miniScore.textContent='✅ Completed! +$1';
          earnDollar();
        }
      }
    };
    miniArea.appendChild(clock);
    setTimeout(()=>{ if(!clicked) clock.remove(); },600);
  },750);
}
