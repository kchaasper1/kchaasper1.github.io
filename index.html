<style>

  *{box-sizing:border-box;}

  #stats{text-align:right;margin-left:auto;}

function canvasPoint(e){
  const r=canvas.getBoundingClientRect();
  let x=(e.clientX-r.left)*canvas.width/r.width+cam.x;
  let y=(e.clientY-r.top)*canvas.height/r.height+cam.y;

// returns the interactive spot under a tap (door, alley, exit, mini-game pad), if any
function tappedInteractable(x,y){

      {x:outside.door.x+outside.door.w/2,y:outside.door.y},
      {x:bankDoor.x+bankDoor.w/2,y:bankDoor.y},

    ];

    if(x>alley.x&&x<alley.x+alley.w&&y>alley.y&&y<alley.y+alley.h)

  } else if(scene==='mine'){
    if(Math.hypot(x-mineExit.x,y-mineExit.y)<40) return {x:mineExit.x,y:mineExit.y,r:35};
    for(const n of mineNodes)
      if(n.hp>0 && Math.hypot(x-n.x,y-n.y)<28) return {x:n.x,y:n.y,r:34};
  } else {

      if(Math.hypot(x-r.pad.x,y-r.pad.y)<40) return {x:r.pad.x,y:r.pad.y,r:40};
  }
  return null;
}
  
let bullets=[];

const WORLD_W=3200, WORLD_H=2400;
const bank={x:1320,y:40,w:220,h:220};

  {x:0,y:300,w:WORLD_W,h:80},     // main road (pedestrians walk here)

];

function inBuildingSolid(x,y,b,door){
  const inB=x>b.x&&x<b.x+b.w&&y>b.y&&y<b.y+b.h;
  const inDoorX=x>door.x&&x<door.x+door.w;
  return inB && !(inDoorX && y>b.y+b.h-25);
}
function blockedAt(x,y){
  const r=player.r;
  if(inBuildingSolid(x,y,outside.building,outside.door)) return true;
  if(inBuildingSolid(x,y,bank,bankDoor)) return true;
  for(const en of enterables) if(inBuildingSolid(x,y,en.b,en.door)) return true;
  for(const o of obstacles)
    if(x+r>o.x && x-r<o.x+o.w && y+r>o.y && y-r<o.y+o.h) return true;
  const nx=(x-lake.cx)/(lake.rx+r), ny=(y-lake.cy)/(lake.ry+r);
  return nx*nx+ny*ny<1;
}

// seeded random, so every player generates the same trees
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const trees=[];
(function(){
  const rng=mulberry32(12345);
  const clear=[
    ...roads.map(r=>({x:r.x-20,y:r.y-20,w:r.w+40,h:r.h+40})),
    ...obstacles.map(o=>({x:o.x-25,y:o.y-25,w:o.w+50,h:o.h+50})),
    ...enterables.map(e=>({x:e.b.x-25,y:e.b.y-25,w:e.b.w+50,h:e.b.h+50})),

    {x:alley.x-20,y:alley.y-20,w:alley.w+40,h:alley.h+40},
    {x:bank.x-25,y:bank.y-25,w:bank.w+50,h:bank.h+50}
  ];
  let tries=0;
  while(trees.length<170 && tries<6000){
    tries++;
    const x=rng()*WORLD_W, y=rng()*WORLD_H;
    if(((x-lake.cx)/(lake.rx+25))**2+((y-lake.cy)/(lake.ry+25))**2<1) continue;
    if(clear.some(k=>x>k.x&&x<k.x+k.w&&y>k.y&&y<k.y+k.h)) continue;
    trees.push({x,y,r:10+rng()*8});
  }

})();



const cam={x:0,y:0};



function wrapX(x){ return ((x%WORLD_W)+WORLD_W)%WORLD_W; }
function wrapY(y){ return ((y%WORLD_H)+WORLD_H)%WORLD_H; }
// shortest signed distance from a to b across the seams
function wdx(a,b){ let d=b-a; if(d>WORLD_W/2) d-=WORLD_W; else if(d<-WORLD_W/2) d+=WORLD_W; return d; }
function wdy(a,b){ let d=b-a; if(d>WORLD_H/2) d-=WORLD_H; else if(d<-WORLD_H/2) d+=WORLD_H; return d; }
function wdist(ax,ay,bx,by){ return Math.hypot(wdx(ax,bx),wdy(ay,by)); }



const GOON_COST = 5;
const WAGE=1;                 // dollars per goon, per payday
const PAY_EVERY_MS=30000;     // payday every 30 seconds
let nextPayday=Date.now()+PAY_EVERY_MS;
const expenseDisplay=document.getElementById('expenseDisplay');
let lastExpenseText='';

function refreshExpenses(){
  const perMin=Math.round(goons.length*WAGE*60000/PAY_EVERY_MS*10)/10;
  const txt='Expenses: $'+perMin+'/min';
  if(txt!==lastExpenseText){ lastExpenseText=txt; expenseDisplay.textContent=txt; }
}

function updatePayroll(){
  const now=Date.now();
  if(goons.length===0){ nextPayday=now+PAY_EVERY_MS; refreshExpenses(); return; }
  while(now>=nextPayday){
    nextPayday+=PAY_EVERY_MS;
    let paid=0, quit=0;
    goons=goons.filter(g=>{
      if(money>=WAGE){ money-=WAGE; paid+=WAGE; return true; }
      quit++; return false;       // can't pay: this goon walks off the job
    });
    moneyDisplay.textContent='💰 $'+money;
    if(quit) toast(quit+(quit>1?' goons quit':' goon quit')+" - you couldn't pay them");
    else if(paid) toast('Paid $'+paid+' in wages');
  }
  refreshExpenses();
}

const INTEREST_RATE=0.02;          // 2% ...
const INTEREST_EVERY_MS=30000;     // ... every 30 seconds
let bankBalance=0;                        // can hold fractions, the screen shows whole dollars
let nextInterest=Date.now()+INTEREST_EVERY_MS;

function bankWhole(){ return Math.floor(bankBalance+1e-9); }



let lastHud='';
const mineralDisplay=document.getElementById('mineralDisplay');
function refreshHud(){
  const t=money+'|'+bankWhole()+'|'+minerals.iron+'|'+minerals.copper+'|'+minerals.gold;
  if(t===lastHud) return;
  lastHud=t;
  moneyDisplay.textContent='💰 $'+money;

    bankBalances.textContent='On you: $'+money+'   |   In bank: $'+bankWhole()+'   |   Interest: '+(INTEREST_RATE*100)+'% / '+(INTEREST_EVERY_MS/1000)+'s';
  if(garageModal.classList.contains('active')) renderGarage();
}



function updateBankInterest(){
  const now=Date.now();
  if(bankBalance<=0){ nextInterest=now+INTEREST_EVERY_MS; return; }
  const before=bankWhole();
  while(now>=nextInterest){ nextInterest+=INTEREST_EVERY_MS; bankBalance*=1+INTEREST_RATE; }
  const gain=bankWhole()-before;
  if(gain>0) toast('Bank interest: +$'+gain);
}
function openBank(){
  bankModal.classList.add('active');
  bankMsg.textContent=''; depAmt.value=''; wdAmt.value='';
  lastHud=''; refreshHud();
}

function bankAction(kind,all){
  let amt = all ? (kind==='dep' ? money : bankWhole())
                : parseInt((kind==='dep'?depAmt:wdAmt).value,10);
  if(!Number.isFinite(amt)||amt<=0){
    bankMsg.textContent = all ? (kind==='dep'?'You have nothing to deposit.':'You have nothing to withdraw.')
                              : 'Enter a whole number above 0.';
    return;
  }
  if(kind==='dep'){
    if(amt>money){ bankMsg.textContent='You only have $'+money+' on you.'; return; }
    money-=amt; bankBalance+=amt; bankMsg.textContent='Deposited $'+amt+'.';
  } else {
    if(amt>bankWhole()){ bankMsg.textContent='You only have $'+bankWhole()+' in the bank.'; return; }
    bankBalance-=amt; money+=amt; bankMsg.textContent='Withdrew $'+amt+'.';
  }
  depAmt.value=''; wdAmt.value='';
  refreshHud();
}

const ORE_COLORS={iron:'#aab0b8',copper:'#d08a50',gold:'#ffd34d'};
const minerals={iron:0,copper:0,gold:0};
const mineExit={x:30,y:230};
const mineNodes=[[150,100],[300,80],[450,120],[600,90],[200,230],[380,260],[560,240],[130,370],[320,380],[520,360],[650,330],[440,200]]
  .map(([x,y])=>{
    const r=Math.random();
    return {x,y,type:r<0.55?'iron':r<0.85?'copper':'gold',hp:3,respawnAt:0};
  });

function nearestOre(){
  let best=null, bd=34;
  mineNodes.forEach(n=>{
    if(n.hp<=0) return;
    const d=Math.hypot(n.x-player.x,n.y-player.y);
    if(d<bd){ bd=d; best=n; }
  });
  return best;
}

function mineOre(){
  const n=nearestOre();
  if(!n) return;
  n.hp--;

function initMultiplayer(){
  if(!firebaseOk) return;
  playersRef.child(myId).onDisconnect().remove();
  goonsRef.child(myId).onDisconnect().remove();
  updatePresence();

  playersRef.on('value', snap=>{
    const val=snap.val()||{};
    delete val[myId];
    const now=Date.now();
    Object.keys(val).forEach(id=>{
      const ls=lastSeen[id];
      if(!ls || ls.ts!==val[id].ts) lastSeen[id]={ts:val[id].ts, at:now};
    });
    const firstLoad=!playersLoaded;
    otherPlayers=val;
    playersLoaded=true;
    fbFailed=false;
    if(firstLoad && Object.keys(val).length===0){
      pedsRef.remove(); pedPosRef.remove(); goonsRef.remove();
    }
  }, err=>{
    console.error('Firebase read failed:',err);
    fbFailed=true;
    toast('Multiplayer connection failed - running solo');
  });
  setTimeout(()=>{
    if(!playersLoaded){ fbFailed=true; console.warn('Firebase did not respond in 5s - running solo'); }
  },5000);
  goonsRef.on('value', snap=>{ otherGoons=snap.val()||{}; });

  // pedestrian details (money, color) live here
  pedsRef.on('value', snap=>{
    const val=snap.val()||{};
    pedestrians=pedestrians.filter(p=>val[p.id]);
    Object.keys(val).forEach(id=>{
      const v=val[id];
      let p=pedestrians.find(q=>q.id===id);
      if(!p){
        p={id,x:v.x0,y:v.y0,rx:v.x0,ry:v.y0,leaving:false};
        pedestrians.push(p);
      }
      p.money=v.money; p.color=v.color; p.speed=v.speed;
      p.synced=true;
    });
  });
  // pedestrian positions (written by the host)
  pedPosRef.on('value', snap=>{
    const val=snap.val()||{};
    pedestrians.forEach(p=>{
      const pos=val[p.id];
      if(pos){ p.rx=pos.x; p.ry=pos.y; }
    });
  });
}
  
function isHost(){
  if(!firebaseOk || fbFailed) return true;
  if(!playersLoaded) return false;
  const now=Date.now();
  return Object.keys(otherPlayers).every(id=>{
    const ls=lastSeen[id];
    const active = ls && now-ls.at<6000;   // heartbeat seen in the last 6 seconds
    return !active || id>myId;
  });
}

function update(){
  let dx=0,dy=0;
  const intent = keys['arrowup']||keys['w']||keys['arrowdown']||keys['s']||keys['arrowleft']||keys['a']||keys['arrowright']||keys['d']||moveTarget;
  const running = (keys['shift']||runOn) && intent && !exhausted && stamina>0;
  const speed = running ? RUN_SPEED : WALK_SPEED;
  if(keys['arrowup']||keys['w']) dy=-speed;
  if(keys['arrowdown']||keys['s']) dy=speed;
  if(keys['arrowleft']||keys['a']) dx=-speed;
  if(keys['arrowright']||keys['d']) dx=speed;
  if(dx||dy){
    moveTarget=null;
    facing={dx: dx?Math.sign(dx):0, dy: dy?Math.sign(dy):(dx?0:facing.dy)};
  } else if(moveTarget){
    const tdx = scene==='outside' ? wdx(player.x,moveTarget.x) : moveTarget.x-player.x;
    const tdy = scene==='outside' ? wdy(player.y,moveTarget.y) : moveTarget.y-player.y;
    const d=Math.hypot(tdx,tdy);
    if(d<=speed){ moveTarget=null; }
    else {
      dx=tdx/d*speed; dy=tdy/d*speed;
      facing={dx:dx/speed, dy:dy/speed};
    }
  }

  if(scene==='outside'){
    const nx=wrapX(player.x+dx), ny=wrapY(player.y+dy);
    if(!blockedAt(nx,ny)){ player.x=nx; player.y=ny; }
    else if(!blockedAt(nx,player.y)) player.x=nx;
    else if(!blockedAt(player.x,ny)) player.y=ny;
    else moveTarget=null;
  } else {
    player.x=Math.min(720-player.r, Math.max(player.r, player.x+dx));
    player.y=Math.min(460-player.r, Math.max(player.r, player.y+dy));
  }

  if(running){
    stamina=Math.max(0,stamina-STAMINA_DRAIN);
    if(stamina===0) exhausted=true;
  } else {
    stamina=Math.min(STAMINA_MAX,stamina+STAMINA_REGEN);
    if(exhausted && stamina>=STAMINA_RESUME) exhausted=false;
  }
  const pct=Math.round(stamina);
  if(pct!==lastStaminaPct){
    lastStaminaPct=pct;
    staminaBar.style.width=pct+'%';
    staminaBar.classList.toggle('low',exhausted);
  }
  
  if(scene==='inside') currentRoom=roomAt(player.x);
  updatePresence();

  bullets.forEach(b=>{
    b.x+=b.dx; b.y+=b.dy; b.life=(b.life||0)+1;
    if(scene==='outside'){ b.x=wrapX(b.x); b.y=wrapY(b.y); }
  });
  if(scene==='outside'){
    bullets.forEach(b=>{
      if(b.dead) return;
      if(b.owner==='goon' && wdist(player.x,player.y,b.x,b.y)<player.r+4){
        b.dead=true;
        const loss=Math.min(money,HIT_PENALTY);   // only cash on you, never the bank
        money-=loss;
        hitUntil=Date.now()+400;
        toast('Ouch! A goon shot you'+(loss?' (-$'+loss+')':''));
        return;
      }
      for(const p of pedestrians){
        if(wdist(p.x,p.y,b.x,b.y)<11){ b.dead=true; killPed(p,b.owner); break; }
      }
    });
  }
  bullets=bullets.filter(b=>!b.dead && b.life<100 &&
    (scene==='outside' || (b.x>0&&b.x<720&&b.y>0&&b.y<460)));

  updatePedestrians();
  updatePayroll();
  updateBankInterest();
  updateMineNodes();
  updateGoons();
  refreshHud();

const near=(x,y,r)=>Math.hypot(player.x-x,player.y-y)<r;

const STEP_MS=1000/60;
let lastTick=Date.now();
function tick(){
  const now=Date.now();
  const raw=Math.floor((now-lastTick)/STEP_MS);
  if(raw<1) return;
  const steps=Math.min(raw,180);               // catch up at most ~3s at once
  lastTick = raw>180 ? now : lastTick+steps*STEP_MS;
  for(let i=0;i<steps;i++) update();
}

function startSimulation(){
  lastTick=Date.now();
  try{
    // a Web Worker's timer isn't throttled as hard as the page's own timers in background tabs
    const w=new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),16)'],{type:'text/javascript'})));
    w.onmessage=tick;
  }catch(e){
    setInterval(tick,16);
  }
}

  } else {
    if(Math.hypot(player.x-insideExit.x,player.y-insideExit.y)<35){ exitBuilding(); return; }
    const d=Math.hypot(player.x-currentRoom.pad.x, player.y-currentRoom.pad.y);
    if(d<40) openGame(currentRoom.game, currentRoom.name);
  }
}



function enterBuilding(){ scene='inside'; player.x=50; player.y=230; }
function exitBuilding(){ scene='outside'; player.x=360; player.y=300; }
function closeModal(){
  modal.classList.remove('active');
  if(activeTimer) clearInterval(activeTimer);
  miniArea.innerHTML='';
}



function hireGoon(){
  if(money<GOON_COST){ toast('Need $'+GOON_COST+' to hire a goon'); return; }
  money-=GOON_COST;
  moneyDisplay.textContent='💰 $'+money;
  goonCounter++;
  goons.push({id:'g'+goonCounter, x:player.x, y:player.y, tx:player.x, ty:player.y, speed:1.2});
  toast('Hired a goon! ('+goons.length+' total)');
}

const STEAL_CHANCE = 0.4; // 40% chance per attempt, change to taste
const SHOOT_CHANCE=0.01;          // chance per frame once the cooldown is over
const GOON_SHOT_COOLDOWN=6000;    // ms between shots, per goon
const GOON_BULLET_SPEED=6;
const FOLLOW_DIST=26;   // how far behind a pedestrian a goon trails

let lastGoonSync=0;
function syncGoons(){
  if(!firebaseOk) return;
  const now=Date.now();
  if(now-lastGoonSync<150) return;
  lastGoonSync=now;
  goonsRef.child(myId).set(goons.length ? goons.map(g=>({x:Math.round(g.x),y:Math.round(g.y)})) : null);
}

function updateGoons(){
  const now=Date.now();
  goons.forEach(g=>{
    let prey=pedestrians.find(p=>p.id===g.preyId && p.money>0 && wdist(p.x,p.y,g.x,g.y)<220);
    if(!prey){
      let best=140;
      pedestrians.forEach(p=>{
        if(p.money<=0) return;
        const d=wdist(p.x,p.y,g.x,g.y);
        if(d<best){ best=d; prey=p; }
      });
      g.preyId=prey?prey.id:null;
    }

    if(prey){
      const ddx=wdx(g.x,prey.x), ddy=wdy(g.y,prey.y), dd=Math.hypot(ddx,ddy)||1;
      const hx=prey.hx!==undefined?prey.hx:ddx/dd;
      const hy=prey.hy!==undefined?prey.hy:ddy/dd;
      g.tx=wrapX(prey.x-hx*FOLLOW_DIST);
      g.ty=wrapY(prey.y-hy*FOLLOW_DIST);
    } else if(wdist(g.x,g.y,g.tx,g.ty)<4){
      g.tx=wrapX(g.x+(Math.random()-0.5)*500);
      g.ty=wrapY(g.y+(Math.random()-0.5)*500);
    }

    const mdx=wdx(g.x,g.tx), mdy=wdy(g.y,g.ty), md=Math.hypot(mdx,mdy);
    if(md>0.5){
      const step=Math.min(g.speed,md);
      g.x=wrapX(g.x+mdx/md*step); g.y=wrapY(g.y+mdy/md*step);
    }

    if(prey && scene==='outside' && now>=(g.nextShot||0) && Math.random()<SHOOT_CHANCE){
      g.nextShot=now+GOON_SHOT_COOLDOWN;
      const a=Math.atan2(wdy(g.y,prey.y),wdx(g.x,prey.x))+(Math.random()-0.5)*0.5;
      bullets.push({x:g.x,y:g.y,dx:Math.cos(a)*GOON_BULLET_SPEED,dy:Math.sin(a)*GOON_BULLET_SPEED,owner:'goon'});
    }

    if(now<(g.nextSteal||0)) return;
    pedestrians.forEach(p=>{
      if(p.money<=0) return;
      if(wdist(p.x,p.y,g.x,g.y)<FOLLOW_DIST+14){
        g.nextSteal=now+2000;
        if(Math.random()<STEAL_CHANCE){
          stealFromPed(p, 1+Math.floor(Math.random()*Math.min(3,p.money)));
        } else {
          toast('A goon failed to steal...');
        }
      }
    });
  });
  syncGoons();
}



let pedestrians=[];
let pedCounter=0;
const MAX_PEDS=20;
const LEAVE_CHANCE=0.0003;  // per frame, per pedestrian (roughly once every 20s)
const SPAWN_CHANCE=0.006;   // per frame while below MAX_PEDS (roughly one every 4s)

function spawnPedestrian(fromEdge){
  const y=305+Math.random()*85;
  const x=fromEdge ? (Math.random()<0.5 ? -15 : WORLD_W+15) : 20+Math.random()*(WORLD_W-40);
  const p={
    id:myId+'_'+(pedCounter++),
    x, y, tx:x, ty:y, leaving:false,
    speed:0.6+Math.random()*0.4,
    money:1+Math.floor(Math.random()*10),
    color:`hsl(${Math.floor(Math.random()*360)},35%,65%)`
  };
pedestrians.push(p);
  if(firebaseOk) pedsRef.child(p.id).set({money:p.money,color:p.color,speed:p.speed,x0:Math.round(x),y0:Math.round(y)});
}

let lastPedSync=0;
function syncPedsHost(){
  if(!firebaseOk) return;
  const now=Date.now();
  if(now-lastPedSync<150) return;
  lastPedSync=now;
  const pos={};
  pedestrians.forEach(p=>pos[p.id]={x:Math.round(p.x),y:Math.round(p.y)});
  pedPosRef.set(pos);
}  

function updatePedestrians(){
  const host=isHost();
  pedestrians.forEach(p=>{
    if(!host){ // everyone else just glides toward the host's latest position
      if(p.rx!==undefined){ p.x+=(p.rx-p.x)*0.25; p.y+=(p.ry-p.y)*0.25; }
      return;
    }
    if(p.tx===undefined){ p.tx=p.x; p.ty=p.y; } // after a host handover
    if(!p.leaving && Math.random()<LEAVE_CHANCE){
      p.leaving=true;
      p.tx = p.x<WORLD_W/2 ? -30 : WORLD_W+30;
      p.ty = p.y;
    }
    if(!p.leaving && Math.hypot(p.tx-p.x,p.ty-p.y)<4){
      p.tx=10+Math.random()*(WORLD_W-20);
      p.ty=305+Math.random()*85;
    }
    const ang=Math.atan2(p.ty-p.y,p.tx-p.x);
    p.x+=Math.cos(ang)*p.speed;
    p.y+=Math.sin(ang)*p.speed;
    if(!p.leaving && p.money<10 && Math.random()<0.001){
      if(firebaseOk) pedsRef.child(p.id+'/money').transaction(m=>m===null?m:Math.min(10,m+1));
      else p.money++;
    }
    if(p.leaving && (p.x<-20||p.x>WORLD_W+20)){
      p.gone=true;
      if(firebaseOk) pedsRef.child(p.id).remove();
    }
  });
  pedestrians=pedestrians.filter(p=>!p.gone);
  pedestrians.forEach(trackHeading);
  if(host){
    const chance=pedestrians.length<10 ? 0.05 : SPAWN_CHANCE; // fill the street quickly at first
    if(pedestrians.length<MAX_PEDS && Math.random()<chance) spawnPedestrian(true);
    syncPedsHost();
  }
}
function trackHeading(p){
  if(p.lx!==undefined){
    const dx=p.x-p.lx, dy=p.y-p.ly, d=Math.hypot(dx,dy);
    if(d>0.05){
      const hx=(p.hx||0)*0.9+dx/d*0.1, hy=(p.hy||0)*0.9+dy/d*0.1;
      const hl=Math.hypot(hx,hy)||1;
      p.hx=hx/hl; p.hy=hy/hl;
    }
  }
  p.lx=p.x; p.ly=p.y;
}



// Shared kill/steal helpers: transactions make sure only one player gets the money
function killPed(p,who){
  const payout=(loot)=>{
    money+=loot;
    toast((who==='goon'?'A goon':'You')+' shot a pedestrian'+(loot?' (+$'+loot+')':''));
  };
  if(!firebaseOk || fbFailed || !p.synced){       // not confirmed by the database: resolve locally
    pedestrians=pedestrians.filter(q=>q!==p);
    if(firebaseOk) pedsRef.child(p.id).remove().catch(()=>{});
    payout(p.money);
    return;
  }
  let loot=0, got=false;
  pedsRef.child(p.id).transaction(cur=>{
    got=false;
    if(cur===null) return null;     // may just be uncached: Firebase re-checks with the real value
    got=true; loot=cur.money; return null;
  },(err,committed)=>{
    if(err){ pedestrians=pedestrians.filter(q=>q!==p); payout(p.money); return; }
    if(committed && got) payout(loot);
  });
}

function stealFromPed(p,amt){
  if(!firebaseOk || fbFailed || !p.synced){
    const t=Math.min(amt,p.money); if(t<=0) return;
    p.money-=t; money+=t; toast('Goon stole $'+t+'!');
    return;
  }
  let taken=0;
  pedsRef.child(p.id).transaction(cur=>{
    taken=0;
    if(cur===null) return null;
    if(cur.money<=0) return cur;
    taken=Math.min(amt,cur.money);
    cur.money-=taken;
    return cur;
  },(err,committed)=>{
    if(!err && committed && taken>0){ money+=taken; toast('Goon stole $'+taken+'!'); }
  });
}



function openGame(type,label){
  modal.classList.add('active');
  modalTitle.textContent=label+" mini-game";
  miniArea.innerHTML=''; miniScore.textContent='';
  if(type==='reflex') startReflex();
  if(type==='chop') startChop();
  if(type==='clocks') startClocks();
}



// Reflex tap — completes after 5 rounds
function startReflex(){
  let round=0, times=[], startT=0, done=false;
  const btn=document.createElement('button');
  btn.id='reflexBtn'; btn.textContent='Wait...'; btn.style.background='#555';
  miniArea.appendChild(btn);
  
  function nextRound(){
    if(round>=5){
      miniScore.textContent='Avg: '+Math.round(times.reduce((a,b)=>a+b,0)/times.length)+'ms — ✅ Completed! +$1';
      btn.textContent='Done!';
      if(!done){ done=true; earnDollar(); }
      return;
    }
    btn.style.background='#a33'; btn.textContent='Wait...';
    setTimeout(()=>{ btn.style.background='#2e6b5e'; btn.textContent='TAP!'; startT=Date.now(); },600+Math.random()*1200);
  }
  
  btn.onclick=()=>{
    if(btn.textContent!=='TAP!') return;
    times.push(Date.now()-startT); round++;
    miniScore.textContent='Round '+round+'/5';
    nextRound();
  };
  nextRound();
}



// Chop — completes when target score is reached
function startChop(){
  let score=0, timeLeft=20, target=12, done=false;
  miniScore.textContent='Score: 0 / '+target+' | Time: 20s';
  const items=['🥕','🥦','🍅','🍆','💣'];
  activeTimer=setInterval(()=>{
    timeLeft--;
    if(!done) miniScore.textContent='Score: '+score+' / '+target+' | Time: '+timeLeft+'s';
    if(timeLeft<=0 && !done){ clearInterval(activeTimer); miniArea.innerHTML='<p style="padding-top:100px">Time up — score '+score+'/'+target+'. Try again!</p>'; }
  },1000);
  
  const spawn=setInterval(()=>{
    if(timeLeft<=0||done){ clearInterval(spawn); return; }
    const el=document.createElement('div');
    const emoji=items[Math.floor(Math.random()*items.length)];
    el.className='falling'; el.textContent=emoji;
    el.style.left=(Math.random()*220)+'px'; el.style.top='0px';
    miniArea.appendChild(el);
    let top=0;
    const fall=setInterval(()=>{
      top+=4; el.style.top=top+'px';
      if(top>230){ clearInterval(fall); el.remove(); }
    },30);
    el.onclick=()=>{
      clearInterval(fall); el.remove();
      score += emoji==='💣' ? -1 : 1;
      if(score>=target && !done){
        done=true; clearInterval(activeTimer); clearInterval(spawn);
        miniScore.textContent='✅ Completed! +$1';
        earnDollar();
      }
    };
  },600);
}



// Whack clocks — completes when target score is reached
function startClocks(){
  let score=0, timeLeft=20, target=8, done=false;
  miniScore.textContent='Score: 0 / '+target+' | Time: 20s';
  const holes=[];
  for(let i=0;i<6;i++){
    const h=document.createElement('div');
    h.className='hole';
    h.style.left=(20+(i%3)*90)+'px';
    h.style.top=(20+Math.floor(i/3)*120)+'px';
    miniArea.appendChild(h);
    holes.push(h);
  }
  
  activeTimer=setInterval(()=>{
    timeLeft--;
    if(!done) miniScore.textContent='Score: '+score+' / '+target+' | Time: '+timeLeft+'s';
    if(timeLeft<=0 && !done){ clearInterval(activeTimer); clearInterval(popper); miniArea.innerHTML='<p style="padding-top:100px">Time up — score '+score+'/'+target+'. Try again!</p>'; }
  },1000);
  
  const popper=setInterval(()=>{
    if(timeLeft<=0||done) return;
    const h=holes[Math.floor(Math.random()*holes.length)];
    const clock=document.createElement('div');
    clock.className='pop'; clock.textContent='⏰';
    clock.style.left=h.style.left; clock.style.top=h.style.top;
    let clicked=false;
    clock.onclick=()=>{
      if(!clicked){
        clicked=true; score++; clock.remove();
        if(score>=target && !done){
          done=true; clearInterval(activeTimer); clearInterval(popper);
          miniScore.textContent='✅ Completed! +$1';
          earnDollar();
        }
      }
    };
    miniArea.appendChild(clock);
    setTimeout(()=>{ if(!clicked) clock.remove(); },600);
  },750);
}
